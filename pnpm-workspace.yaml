packages:
  - "apps/*"
  - "packages/*"
  - "scripts"
allowBuilds:
  esbuild: true
  unrs-resolver: true
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
overrides:
  # The vulnerable axios (8 high-severity CVEs) originally came bundled
  # with @stellar/stellar-sdk@16.3.1 (a dependency of @x402/stellar and
  # vellar-cli, pinned to 2.22.0/0.1.1 per docs/decisions.md). The whole
  # workspace is on 16.3.1 now too (passkey-kit compatibility; see
  # docs/decisions.md, 2026-10-06), so this override still matters: force
  # the patched axios everywhere rather than whatever 16.3.1 itself bundles.
  axios: ^1.20.0
